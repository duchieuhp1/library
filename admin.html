<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Auto Metadata Fetcher - Cải Tiến Tốc Độ</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 30px; max-width: 650px; margin: 0 auto; background: #f9f9fb; color: #333; }
        h2 { color: #e74c3c; margin-bottom: 5px; }
        .description { color: #666; font-size: 14px; margin-bottom: 20px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { padding: 12px; width: 100%; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; outline: none; transition: border 0.2s; }
        input:focus { border-color: #e74c3c; }
        button { padding: 12px 24px; background: #e74c3c; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: background 0.2s; white-space: nowrap; }
        button:hover { background: #c0392b; }
        .result-box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #eee; margin-top: 20px; }
        .status-loading { color: #f39c12; font-weight: bold; padding: 15px; background: #fef9e7; border-radius: 6px; border-left: 4px solid #f39c12; }
        textarea { width: 100%; margin-top: 12px; font-family: 'Courier New', Courier, monospace; padding: 12px; border: 1px solid #eee; background: #2d3748; color: #a0aec0; border-radius: 6px; resize: vertical; box-sizing: border-box; }
        .game-info-preview { display: flex; gap: 20px; margin-bottom: 15px; align-items: center; background: #f8f9fa; padding: 15px; border-radius: 6px; }
        .badge { display: inline-block; padding: 3px 8px; background: #e2e8f0; border-radius: 4px; font-size: 12px; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>

    <h2>🛠️ Công cụ tạo JSON & Metadata Tốc độ cao</h2>
    <p class="description">Phiên bản cải tiến: Khắc phục triệt để lỗi nghẽn Proxy, tự động tạo cấu trúc và link ảnh trực tiếp.</p>
    
    <div class="input-group">
        <input type="text" id="game-id" placeholder="Nhập ID game (VD: 0100A6301214E000)">
        <button onclick="generateMetadata()">Tạo Mã JSON</button>
    </div>

    <div id="result" class="result-box" style="display: none;"></div>

    <script>
        async function generateMetadata() {
            const id = document.getElementById('game-id').value.trim().toUpperCase();
            const resultDiv = document.getElementById('result');
            
            if (!id) {
                alert('Vui lòng nhập Game ID!');
                return;
            }

            // Hiển thị trạng thái đang xử lý thần tốc
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `<div class="status-loading">⏳ Đang xử lý dữ liệu và cấu hình link ảnh trực tiếp...</div>`;

            // Định nghĩa ngay link ảnh trực tiếp từ CDN của Tinfoil (Không cần đi vòng qua Proxy)
            const thumbnail = `https://tinfoil.media/ti/${id}/0/0/`;
            let name = "Tên Game (Thay thế bằng tên thực tế nếu không fetch được)";

            try {
                // Sử dụng API mở cấu trúc siêu nhẹ của tinfoil (nếu còn hoạt động), hoặc ép lấy từ nguồn dữ liệu thô
                const targetUrl = `https://tinfoil.io/Title/${id}`;
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
                
                // Đặt timeout 3 giây, nếu proxy quá chậm sẽ tự động chuyển sang chế độ tạo nhanh không bắt chờ đợi
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 3500);

                const response = await fetch(proxyUrl, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (response.ok) {
                    const data = await response.json();
                    if (data && data.contents) {
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(data.contents, 'text/html');
                        const titleTag = doc.querySelector('title');
                        if (titleTag && titleTag.innerText) {
                            let fetchedName = titleTag.innerText.replace(' - Tinfoil', '').trim();
                            if (fetchedName && fetchedName !== 'Tinfoil' && fetchedName !== 'Loading...') {
                                name = fetchedName;
                            }
                        }
                    }
                }
            } catch (error) {
                // Nếu bị timeout hoặc Proxy lỗi, hệ thống âm thầm bỏ qua và dùng chế độ tạo form điền nhanh
                console.log("Chuyển sang chế độ tạo mã trực tiếp do hệ thống Proxy quá tải.");
            }

            // Cấu trúc JSON chuẩn chỉnh, không bị lỗi dấu phẩy hay sai định dạng
            const finalJson = {
                name: name,
                id: id,
                version: "NSP",
                size: "TBD",
                link: "",
                thumbnail: thumbnail
            };

            // Hiển thị kết quả ngay tức khắc
            resultDiv.innerHTML = `
                <h3 style="color: #2ed573; margin-top:0;">✅ Đã đồng bộ cấu trúc JSON thành công!</h3>
                <div class="game-info-preview">
                    <img src="${thumbnail}" width="90" height="90" style="object-fit: cover; border-radius: 6px; background: #e2e8f0;" 
                         alt="Thumbnail" onerror="this.src='https://via.placeholder.com/90x90?text=No+Cover'">
                    <div>
                        <p style="margin: 0 0 5px 0; font-weight: bold; font-size: 16px;">${name}</p>
                        <p style="margin: 0; color: #718096; font-size: 13px;">ID: ${id}</p>
                        <span class="badge" style="background: #e8f8f5; color: #1abc9c;">Ảnh gốc CDN</span>
                    </div>
                </div>
                <p style="font-size: 14px; margin-bottom: 5px;">Bấm chuột vào khung dưới để copy tự động, sau đó dán vào file <b>games.json</b>:</p>
                <textarea rows="8" readonly onclick="copyJsonText(this)">${JSON.stringify(finalJson, null, 4)},</textarea>
                <p style="font-size: 11px; color: #a0aec0; margin-top: 5px;">💡 Mẹo: Khung trên tự động bôi đen, chỉ cần nhấn Ctrl+C (hoặc Cmd+C) là xong.</p>
            `;
        }

        function copyJsonText(textarea) {
            textarea.select();
            document.execCommand('copy'); // Backup copy nhanh cho các trình duyệt cũ
            navigator.clipboard.writeText(textarea.value).then(() => {
                alert('Đã copy đoạn mã JSON vào Clipboard!');
            }).catch(() => {});
        }
    </script>
</body>
</html>
