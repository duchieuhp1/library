<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Auto Metadata Fetcher - Siêu Tốc API</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 30px; max-width: 650px; margin: 0 auto; background: #f9f9fb; color: #333; }
        h2 { color: #e74c3c; margin-bottom: 5px; }
        .description { color: #666; font-size: 14px; margin-bottom: 20px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { padding: 12px; width: 100%; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; outline: none; transition: border 0.2s; }
        input:focus { border-color: #e74c3c; }
        button { padding: 12px 24px; background: #e74c3c; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: background 0.2s; white-space: nowrap; }
        button:hover { background: #c0392b; }
        .result-box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #eee; margin-top: 20px; }
        .status-loading { color: #f39c12; font-weight: bold; padding: 15px; background: #fef9e7; border-radius: 6px; border-left: 4px solid #f39c12; }
        textarea { width: 100%; margin-top: 12px; font-family: 'Courier New', Courier, monospace; padding: 12px; border: 1px solid #eee; background: #2d3748; color: #a0aec0; border-radius: 6px; resize: vertical; box-sizing: border-box; }
        .game-info-preview { display: flex; gap: 20px; margin-bottom: 15px; align-items: flex-start; background: #f8f9fa; padding: 15px; border-radius: 6px; }
        .game-details-text p { margin: 4px 0; font-size: 14px; color: #4a5568; }
        .badge { display: inline-block; padding: 3px 8px; background: #edf2f7; color: #4a5568; border-radius: 4px; font-size: 12px; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>

    <h2>🛠️ Công cụ tra cứu Metadata API</h2>
    <p class="description">Phiên bản sửa lỗi: Sử dụng API danh mục trực tiếp để lấy Name, Publisher, Release Date, Size mà không lo bị chặn.</p>
    
    <div class="input-group">
        <input type="text" id="game-id" placeholder="Nhập ID game (VD: 0100A6301214E000)">
        <button onclick="fetchGameMetadata()">Tìm Kiếm</button>
    </div>

    <div id="result" class="result-box" style="display: none;"></div>

    <script>
        async function fetchGameMetadata() {
            const id = document.getElementById('game-id').value.trim().toUpperCase();
            const resultDiv = document.getElementById('result');
            
            if (!id) {
                alert('Vui lòng nhập Game ID!');
                return;
            }

            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `<div class="status-loading">⏳ Đang truy vấn luồng dữ liệu từ API Switch công cộng...</div>`;

            const thumbnail = `https://tinfoil.media/ti/${id}/0/0/`;
            
            // Giá trị dự phòng chuẩn nếu không tìm thấy trong database API
            let name = "Tên Game (Không tìm thấy, hãy nhập tay)";
            let publisher = "Unknown";
            let releaseDate = "Unknown";
            let size = "TBD";

            try {
                // Sử dụng nguồn API dữ liệu Switch thô cực kỳ uy tín và không chặn CORS
                const apiUrl = `https://raw.githubusercontent.com/blawar/titledb/master/US.en.json`;
                
                const response = await fetch(apiUrl);
                if (response.ok) {
                    const db = await response.json();
                    
                    // Kiểm tra xem ID có tồn tại trong cơ sở dữ liệu không
                    if (db && db[id]) {
                        const gameData = db[id];
                        name = gameData.name || name;
                        publisher = gameData.publisher || "Unknown";
                        
                        // Định dạng lại ngày ra mắt nếu có (YYYYMMDD sang DD-MM-YYYY)
                        if (gameData.releaseDate) {
                            const dateStr = String(gameData.releaseDate);
                            if (dateStr.length === 8) {
                                releaseDate = `${dateStr.substring(4,6)}-${dateStr.substring(6,8)}-${dateStr.substring(0,4)}`;
                            } else {
                                releaseDate = dateStr;
                            }
                        }
                        
                        // Tính toán dung lượng từ Bytes sang GB/MB cho trực quan
                        if (gameData.size) {
                            const bytes = parseInt(gameData.size);
                            if (bytes >= 1073741824) {
                                size = (bytes / 1073741824).toFixed(1) + " GB";
                            } else {
                                size = (bytes / 1048576).toFixed(0) + " MB";
                            }
                        }
                    }
                }
            } catch (error) {
                console.log("Không kết nối được API, chuyển sang sinh bộ khung rỗng.", error);
            }

            const finalJson = {
                name: name,
                id: id,
                publisher: publisher,
                releaseDate: releaseDate,
                version: "NSP",
                size: size,
                link: "",
                thumbnail: thumbnail
            };

            resultDiv.innerHTML = `
                <h3 style="color: #2ed573; margin-top:0;">✅ Đã đồng bộ dữ liệu thành công!</h3>
                <div class="game-info-preview">
                    <img src="${thumbnail}" width="100" height="100" style="object-fit: cover; border-radius: 6px; background: #e2e8f0; box-shadow: 0 2px 8px rgba(0,0,0,0.1);" 
                         alt="Thumbnail" onerror="this.src='https://via.placeholder.com/100x100?text=No+Cover'">
                    <div class="game-details-text">
                        <p><strong>Tên Game:</strong> <span style="color: #e74c3c; font-weight:bold;">${name}</span></p>
                        <p><strong>ID:</strong> <code>${id}</code></p>
                        <p><strong>Publisher:</strong> ${publisher}</p>
                        <p><strong>Release Date:</strong> ${releaseDate}</p>
                        <p><strong>Size:</strong> <span class="badge">${size}</span></p>
                    </div>
                </div>
                <p style="font-size: 14px; margin-bottom: 5px;">Bấm vào ô dưới để copy, sau đó dán vào file <b>games.json</b>:</p>
                <textarea rows="11" readonly onclick="copyJsonText(this)">${JSON.stringify(finalJson, null, 4)},</textarea>
                <p style="font-size: 11px; color: #a0aec0; margin-top: 5px;">💡 Hệ thống tự động xử lý chuyển đổi dữ liệu kích thước chuẩn sang GB/MB cho bạn.</p>
            `;
        }

        function copyJsonText(textarea) {
            textarea.select();
            navigator.clipboard.writeText(textarea.value).then(() => {
                alert('Đã tự động copy mã JSON vào bộ nhớ tạm!');
            }).catch(() => {
                document.execCommand('copy');
            });
        }
    </script>
</body>
</html>
