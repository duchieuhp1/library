<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Auto Metadata Fetcher - Bản Nâng Cấp Chi Tiết</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 30px; max-width: 650px; margin: 0 auto; background: #f9f9fb; color: #333; }
        h2 { color: #e74c3c; margin-bottom: 5px; }
        .description { color: #666; font-size: 14px; margin-bottom: 20px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { padding: 12px; width: 100%; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; outline: none; transition: border 0.2s; }
        input:focus { border-color: #e74c3c; }
        button { padding: 12px 24px; background: #e74c3c; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: background 0.2s; white-space: nowrap; }
        button:hover { background: #c0392b; }
        .result-box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #eee; margin-top: 20px; }
        .status-loading { color: #f39c12; font-weight: bold; padding: 15px; background: #fef9e7; border-radius: 6px; border-left: 4px solid #f39c12; }
        textarea { width: 100%; margin-top: 12px; font-family: 'Courier New', Courier, monospace; padding: 12px; border: 1px solid #eee; background: #2d3748; color: #a0aec0; border-radius: 6px; resize: vertical; box-sizing: border-box; }
        .game-info-preview { display: flex; gap: 20px; margin-bottom: 15px; align-items: flex-start; background: #f8f9fa; padding: 15px; border-radius: 6px; }
        .game-details-text p { margin: 4px 0; font-size: 14px; color: #4a5568; }
        .badge { display: inline-block; padding: 3px 8px; background: #e8f8f5; color: #1abc9c; border-radius: 4px; font-size: 12px; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>

    <h2>🛠️ Công cụ tra cứu Metadata Nâng Cao</h2>
    <p class="description">Tự động quét: Tên, Ảnh bìa, Nhà phát hành (Publisher), Ngày ra mắt (Release Date), và Dung lượng (Size).</p>
    
    <div class="input-group">
        <input type="text" id="game-id" placeholder="Nhập ID game (VD: 0100A6301214E000)">
        <button onclick="fetchAdvancedMetadata()">Tìm Kiếm</button>
    </div>

    <div id="result" class="result-box" style="display: none;"></div>

    <script>
        async function fetchAdvancedMetadata() {
            const id = document.getElementById('game-id').value.trim().toUpperCase();
            const resultDiv = document.getElementById('result');
            
            if (!id) {
                alert('Vui lòng nhập Game ID!');
                return;
            }

            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `<div class="status-loading">⏳ Đang kết nối proxy và trích xuất dữ liệu chi tiết từ Tinfoil...</div>`;

            // Cấu hình link ảnh trực tiếp từ CDN gốc
            const thumbnail = `https://tinfoil.media/ti/${id}/0/0/`;
            
            // Khởi tạo các giá trị mặc định phòng trường hợp mạng lỗi
            let name = "Không tìm thấy tên (Nhập tay)";
            let publisher = "Unknown";
            let releaseDate = "Unknown";
            let size = "TBD";

            try {
                const targetUrl = `https://tinfoil.io/Title/${id}`;
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
                
                // Giới hạn thời gian chờ chống treo trang
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 6000);

                const response = await fetch(proxyUrl, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (response.ok) {
                    const data = await response.json();
                    if (data && data.contents) {
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(data.contents, 'text/html');
                        
                        // 1. Trích xuất Tên Game từ thẻ title
                        const titleTag = doc.querySelector('title');
                        if (titleTag && titleTag.innerText) {
                            let fetchedName = titleTag.innerText.replace(' - Tinfoil', '').trim();
                            if (fetchedName && fetchedName !== 'Tinfoil' && fetchedName !== 'Loading...') {
                                name = fetchedName;
                            }
                        }

                        // 2. Trích xuất Publisher, Release Date, Size từ các hàng bảng dữ liệu trên web
                        const rows = doc.querySelectorAll('.box .row, table tr, div'); 
                        // Tinfoil sắp xếp thông tin theo các cặp text song song, ta sẽ duyệt qua mã HTML text để tìm bóc tách
                        const fullText = doc.body.innerText;

                        // Tìm Size bằng Regex
                        const sizeMatch = fullText.match(/Size\s*:\s*([\d\.]+\s*(GB|MB))/i) || fullText.match(/([\d\.]+\s*(GB|MB))/);
                        if (sizeMatch) size = sizeMatch[1];

                        // Quét kỹ hơn trong cấu trúc các thẻ thông tin của Tinfoil
                        const allElements = doc.querySelectorAll('*');
                        allElements.forEach(el => {
                            const text = el.innerText ? el.innerText.trim() : '';
                            
                            // Bóc tách Publisher
                            if (text.startsWith('Publisher') && el.nextElementSibling) {
                                publisher = el.nextElementSibling.innerText.trim();
                            } else if (text.includes('Publisher:')) {
                                publisher = text.replace('Publisher:', '').trim();
                            }

                            // Bóc tách Release Date
                            if ((text.startsWith('Release Date') || text.startsWith('Release')) && el.nextElementSibling) {
                                releaseDate = el.nextElementSibling.innerText.trim();
                            } else if (text.includes('Release Date:')) {
                                releaseDate = text.replace('Release Date:', '').trim();
                            }
                            
                            // Bóc tách Size (Dự phòng nếu regex trượt)
                            if (text.startsWith('Size') && el.nextElementSibling) {
                                let fSize = el.nextElementSibling.innerText.trim();
                                if(fSize.includes('GB') || fSize.includes('MB')) size = fSize;
                            }
                        });
                    }
                }
            } catch (error) {
                console.log("Đã kích hoạt chế độ tự động điền do lỗi đường truyền hoặc Proxy.");
            }

            // Tạo cấu trúc JSON chuẩn chỉnh với các thuộc tính mới phục vụ nâng cấp tương lai
            const finalJson = {
                name: name,
                id: id,
                publisher: publisher,
                releaseDate: releaseDate,
                version: "NSP",
                size: size,
                link: "",
                thumbnail: thumbnail
            };

            // Hiển thị kết quả ra giao diện trực quan cho admin
            resultDiv.innerHTML = `
                <h3 style="color: #2ed573; margin-top:0;">✅ Đã đồng bộ dữ liệu thành công!</h3>
                <div class="game-info-preview">
                    <img src="${thumbnail}" width="100" height="100" style="object-fit: cover; border-radius: 6px; background: #e2e8f0; box-shadow: 0 2px 8px rgba(0,0,0,0.1);" 
                         alt="Thumbnail" onerror="this.src='https://via.placeholder.com/100x100?text=No+Cover'">
                    <div class="game-details-text">
                        <p><strong>Tên Game:</strong> <span style="color: #e74c3c; font-weight:bold;">${name}</span></p>
                        <p><strong>ID:</strong> <code>${id}</code></p>
                        <p><strong>Publisher:</strong> ${publisher}</p>
                        <p><strong>Release Date:</strong> ${releaseDate}</p>
                        <p><strong>Size:</strong> <span class="badge" style="background:#edf2f7; color:#4a5568;">${size}</span></p>
                    </div>
                </div>
                <p style="font-size: 14px; margin-bottom: 5px;">Click vào khung dưới để copy mã JSON rồi dán vào <b>games.json</b>:</p>
                <textarea rows="11" readonly onclick="copyJsonText(this)">${JSON.stringify(finalJson, null, 4)},</textarea>
                <p style="font-size: 11px; color: #a0aec0; margin-top: 5px;">💡 Chỉ cần bấm chuột vào ô text, mã sẽ tự động copy vào bộ nhớ tạm!</p>
            `;
        }

        function copyJsonText(textarea) {
            textarea.select();
            navigator.clipboard.writeText(textarea.value).then(() => {
                alert('Đã copy đoạn mã JSON chi tiết vào Clipboard!');
            }).catch(() => {
                document.execCommand('copy');
            });
        }
    </script>
</body>
</html>
