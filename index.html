<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Game Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="toolbar">
        <div>
            <strong>Tổng số:</strong> <span id="game-count">0</span> object(s)
        </div>
        
        <div>
            <label for="search-input">🔍 Tìm kiếm:</label>
            <input type="text" id="search-input" class="search-box" placeholder="Nhập tên game hoặc ID...">
        </div>

        <div>
            <label for="sort-select">Sắp xếp theo:</label>
            <select id="sort-select">
                <option value="default">Mặc định (Theo JSON)</option>
                <option value="name-asc">Tên (A - Z)</option>
                <option value="name-desc">Tên (Z - A)</option>
                <option value="id-asc">Mã Game ID</option>
            </select>
        </div>
    </div>

    <div id="game-list">Đang tải dữ liệu...</div>

    <script src="script.js"></script>
</body>
</html>
