<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Game Storage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; }
        .game-card:hover { transform: translateY(-5px); transition: 0.3s; }
    </style>
</head>
<body class="p-5 md:p-10">
    <div class="max-w-5xl mx-auto">
        <h1 class="text-3xl font-bold mb-8 border-b border-slate-700 pb-4">🎮 My Nintendo Switch Collection</h1>
        
        <!-- Thanh tìm kiếm -->
        <input type="text" id="search" placeholder="Search game name..." class="w-full p-3 rounded-lg bg-slate-800 border border-slate-700 mb-8 focus:outline-none focus:ring-2 focus:ring-cyan-500">

        <!-- Danh sách Game -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="game-list">
            
            <!-- Item 1: Copy đoạn này khi muốn thêm game mới -->
            <div class="game-card bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-xl">
                <h3 class="text-xl font-semibold text-cyan-400">Elden Ring</h3>
                <p class="text-sm text-slate-400 my-2">Size: 14.2 GB | Version: v1.0.0</p>
                <div class="flex gap-2 mb-4">
                    <span class="bg-slate-700 px-2 py-1 rounded text-xs text-slate-300">Base Game</span>
                </div>
                <a href="LINK_GOOGLE_DRIVE_CỦA_ÔNG" target="_blank" class="block text-center bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2 rounded-lg transition">GO TO DRIVE</a>
            </div>

            <!-- Item 2 -->
            <div class="game-card bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-xl">
                <h3 class="text-xl font-semibold text-cyan-400">Hollow Knight</h3>
                <p class="text-sm text-slate-400 my-2">Size: 5.1 GB | Version: v1.4.3.2</p>
                <div class="flex gap-2 mb-4">
                    <span class="bg-slate-700 px-2 py-1 rounded text-xs text-slate-300">Full DLC</span>
                </div>
                <a href="LINK_DRIVE_2" target="_blank" class="block text-center bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2 rounded-lg transition">GO TO DRIVE</a>
            </div>

        </div>
    </div>

    <script>
        // Script tìm kiếm nhanh
        document.getElementById('search').addEventListener('input', function(e) {
            let term = e.target.value.toLowerCase();
            let cards = document.querySelectorAll('.game-card');
            cards.forEach(card => {
                let name = card.querySelector('h3').innerText.toLowerCase();
                card.style.display = name.includes(term) ? 'block' : 'none';
            });
        });
    </script>
</body>
</html>
