<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Game Library</title>
    <style>
        /* CSS cơ bản để dễ nhìn hơn */
        body { font-family: sans-serif; padding: 20px; }
        .toolbar { margin-bottom: 20px; }
        .game-item { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        .game-item h3 { margin: 0 0 5px 0; }
        .game-link { color: blue; text-decoration: none; }
    </style>
</head>
<body>

    <div class="toolbar">
        <strong>Tổng số:</strong> <span id="game-count">0 object(s)</span>
        <span style="margin-left: 20px;">
            <label for="sort-select">Sắp xếp theo:</label>
            <select id="sort-select">
                <option value="default">Mặc định</option>
                <option value="name-asc">Tên (A - Z)</option>
                <option value="name-desc">Tên (Z - A)</option>
                <option value="id-asc">Mã Game ID (Tăng dần)</option>
            </select>
        </span>
    </div>

    <div id="game-list">
        </div>

    <script src="app.js"></script> </body>
</html>
