<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Game Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="toolbar">
        <div><strong>Total:</strong> <span id="game-count">0</span> object(s)</div>
        <div>
            <label>🔍 Search:</label>
            <input type="text" id="search-input" class="search-box" placeholder="Search by game name or ID...">
        </div>
        <div>
            <label>Sort:</label>
            <select id="sort-select">
                <option value="name-asc">Name (A-Z)</option>
                <option value="name-desc">Name (Z-A)</option>
                <option value="id-asc">Game ID</option>
            </select>
        </div>
    </div>

    <div id="game-list">Loading resources...</div>

    <script src="script.js"></script>
</body>
</html>
